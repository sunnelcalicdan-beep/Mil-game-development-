<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Project File Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="landing-page">

    <canvas id="particleCanvas"></canvas>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="landing-shell">

        <section class="hero-card">

            <div class="hero-glow"></div>

            <div class="eyebrow">
                MIL PROJECT · GAME DEVELOPMENT
            </div>

            <h1>
                WELCOME TO
                <span>PROJECT FILE HUB</span>
            </h1>

            <p class="handled-title">
                This website is handled by:
            </p>

            <div class="people-list">

                <span class="person featured">
                    Sunnel John Rebano 🧑🏻‍🔧
                </span>

                <span class="person">Rhea Kim</span>
                <span class="person">Kimberly</span>
                <span class="person">Charles Tiong</span>
                <span class="person">Reyden Osia</span>
                <span class="person">Mc Lawrence Conzaga</span>
                <span class="person">Kimmy Clavo</span>
                <span class="person">Dianne Gadia</span>
                <span class="person">Carl Caabay</span>
                <span class="person">Mark Camaso</span>
                <span class="person">Maynard Cabada</span>
                <span class="person">Mark Anthony Canta</span>

            </div>

            <p class="project-description">
                For MIL Project Game Development.
            </p>

            <button
                class="enter-button"
                id="enterProject"
                type="button"
            >
                <span>ENTER PROJECT</span>
                <strong>→</strong>
            </button>

        </section>

    </main>

    <script src="particle.js"></script>

    <script>
        document
            .getElementById("enterProject")
            .addEventListener("click", () => {
                window.location.href = "hub.html";
            });
    </script>

</body>
</html>
